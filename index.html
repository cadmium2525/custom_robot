<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HOLOSSEUM — Arena Robo Battle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="description" content="A high-fidelity arena robo battle game. Build your machine, take the holosseum, win the league." />
<meta name="theme-color" content="#05070d" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070b14'/%3E%3Cpath d='M8 11h16v3H8zM8 18h6v4H8zM18 18h6v4h-6z' fill='%2359b7ff'/%3E%3Cpath d='M13 6h6v3h-6z' fill='%23ff7a1a'/%3E%3C/svg%3E" />
<style>
  /* Critical shell styling — everything else ships in ui.css. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05070d;
    color: #e8eef7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
                 "Hiragino Sans", "Noto Sans JP", Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  #view {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }
  #hud-layer, #ui-layer {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #ui-layer { z-index: 20; }
  #hud-layer { z-index: 10; }

  /* Pre-boot splash, replaced the moment the first frame lands. */
  #splash {
    position: absolute; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 40%, #0d1626 0%, #05070d 65%);
    transition: opacity .5s ease, visibility .5s;
  }
  #splash.gone { opacity: 0; visibility: hidden; }
  #splash .mark {
    font-size: clamp(28px, 7vw, 64px);
    font-weight: 800;
    letter-spacing: .28em;
    color: #cfe6ff;
    text-shadow: 0 0 26px rgba(89,183,255,.55);
  }
  #splash .sub {
    margin-top: 14px; text-align: center;
    font-size: 12px; letter-spacing: .42em; color: #5c7a9e;
  }
  #noscript {
    position: absolute; inset: 0; z-index: 200;
    display: grid; place-items: center; padding: 24px;
    background: #05070d; text-align: center; line-height: 1.7;
  }
</style>
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <div id="hud-layer"></div>
    <div id="ui-layer"></div>
    <div id="splash">
      <div>
        <div class="mark">HOLOSSEUM</div>
        <div class="sub">ARENA ROBO BATTLE</div>
      </div>
    </div>
  </div>
  <noscript>
    <div id="noscript">
      <div>
        <h1>HOLOSSEUM</h1>
        <p>This game needs JavaScript and WebGL. Please enable JavaScript to play.</p>
      </div>
    </div>
  </noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
